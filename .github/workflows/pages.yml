# Publishes Spectre Lab to GitHub Pages on every push to main.
# Runs the tests, builds dist/spectre-lab.html from src/, and serves it as a standalone index.html.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:          # a push that only touches these doesn't change the page
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no dependencies, no lockfile

      - name: Test
        run: npm test

      - name: Build
        run: |
          # The version stamp shows the commit time, so the same commit always builds the same page.
          stamp() { grep -oE 'class="ver">v[^<]*</span>[0-9a-f]{7}' dist/spectre-lab.html | head -1 || true; }
          committed=$(stamp)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) npm run build
          fresh=$(stamp)
          if [ "$committed" != "$fresh" ]; then
            echo "::warning file=dist/spectre-lab.html::The committed page is older than src/. The site uses a fresh build; run npm run build and commit dist/ to bring the repo copy up to date."
          fi
          npm run site   # wraps the page as a standalone document in _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
